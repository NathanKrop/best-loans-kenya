services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: bestloans
      POSTGRES_USER: bestloans
      POSTGRES_PASSWORD: local-dev-only-change-me
    ports:
      - "5432:5432"
    volumes:
      - bestloans-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bestloans -d bestloans"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bestloans-postgres:
