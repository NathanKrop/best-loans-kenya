<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Best Loans Kenya – Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  /* PesaFlex Fintech Color Palette */
  --navy: #0F2A47;               /* primary surface */
  --navy-dark: #0B2038;          /* hover/pressed */
  --emerald: #10B981;            /* primary accent, buttons, icon tiles */
  --emerald-dark: #0E9F6E;       /* button hover */
  --bg: #F3F7FB;                 /* page/panel background */
  --card-bg: #FFFFFF;            /* card background */
  --text-heading: #0F2A47;       /* heading text on light */
  --text-muted: #5B6B7C;         /* body/muted text on light */
  --text-on-navy: #FFFFFF;       /* primary text on navy */
  --text-on-navy-muted: #C9D6E3; /* secondary text on navy */
  --border: #E5ECF3;             /* borders/dividers */

  /* Compatibility aliases */
  --g: var(--emerald);
  --gd: var(--emerald-dark);
  --sun: var(--emerald);
  --ink: var(--text-heading);
  --c: var(--card-bg);
  --m: var(--text-muted);
  --b: var(--border);
  --tint: #E8F8F2;
  --err: #EF4444;
  --warn: rgba(15, 42, 71, 0.08);
  --warnt: var(--navy);
  --bad: #FEE2E2;

  /* Shadows and radii */
  --shadow-sm: 0 1px 3px rgba(15, 42, 71, 0.05);
  --shadow: 0 4px 20px -2px rgba(15, 42, 71, 0.06), 0 2px 6px -1px rgba(15, 42, 71, 0.04);
  --shadow-lg: 0 12px 32px -4px rgba(15, 42, 71, 0.12);
  --radius-sm: 10px;
  --radius-md: 14px;
  --radius-2xl: 16px;            /* rounded-2xl */
  --radius-3xl: 28px;

  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

*, *:before, *:after { box-sizing: inherit; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text-heading);
  font: 400 15px/1.5 "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3 {
  margin: 0 0 .5em;
  letter-spacing: -.02em;
  line-height: 1.2;
  color: var(--text-heading);
}
h1 { font-size: 1.55rem; font-weight: 800; }
h2 { font-size: 1.18rem; font-weight: 700; }
.w { max-width: 1100px; margin: 0 auto; padding: 0 18px; }

/* Sticky Header with Navy Background */
header {
  background: var(--navy);
  color: #FFFFFF;
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 20;
  box-shadow: 0 2px 12px rgba(11, 32, 56, 0.18);
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
}
.top {
  display: flex;
  align-items: center;
  gap: 14px;
  height: 60px;
}
.top .brand {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-right: auto;
}
.top b {
  font-weight: 800;
  font-size: 1.05rem;
  color: #FFFFFF;
}
.top span {
  font-size: .85rem;
  color: var(--text-on-navy-muted);
}

/* Icon tiles / Logo badge: emerald green rounded square with white icon */
.logo-badge {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  background: var(--emerald);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: #FFFFFF;
  box-shadow: 0 2px 6px rgba(16, 185, 129, 0.35);
  flex-shrink: 0;
}

.tabs {
  background: var(--card-bg);
  border-bottom: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
}
.tabs .w {
  display: flex;
  gap: 6px;
  overflow-x: auto;
}
.tabs button {
  background: none;
  border: 0;
  border-bottom: 3px solid transparent;
  padding: 14px 16px;
  font: 600 .92rem inherit;
  font-family: inherit;
  color: var(--text-muted);
  cursor: pointer;
  white-space: nowrap;
  transition: all .15s ease;
}
.tabs button:hover {
  color: var(--navy);
}
.tabs button[aria-selected=true] {
  color: var(--navy);
  border-color: var(--emerald);
  font-weight: 700;
}

/* Main Buttons: Emerald Green (#10B981) rounded-2xl */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: var(--emerald);
  color: #FFFFFF;
  border: 0;
  border-radius: var(--radius-2xl);
  padding: 10px 18px;
  font: 700 .9rem inherit;
  font-family: inherit;
  cursor: pointer;
  text-decoration: none;
  box-shadow: 0 2px 8px rgba(16, 185, 129, 0.25);
  transition: all .2s cubic-bezier(0.16, 1, 0.3, 1);
}
.btn:hover {
  background: var(--emerald-dark);
  box-shadow: 0 4px 12px rgba(16, 185, 129, 0.35);
  transform: translateY(-1px);
  color: #FFFFFF;
}
.btn:active { transform: translateY(0); }
.btn.o {
  background: transparent;
  color: var(--emerald);
  border: 1.5px solid var(--emerald);
  box-shadow: none;
}
.btn.o:hover {
  background: var(--tint);
  border-color: var(--emerald-dark);
  color: var(--emerald-dark);
}
.btn.o.nav-btn {
  color: #FFFFFF;
  border-color: rgba(255, 255, 255, 0.4);
}
.btn.o.nav-btn:hover {
  background: rgba(255, 255, 255, 0.12);
  border-color: #FFFFFF;
  color: #FFFFFF;
}
.btn.r {
  background: var(--err);
  box-shadow: 0 2px 8px rgba(239, 68, 68, 0.25);
}
.btn.r:hover {
  background: #DC2626;
  box-shadow: 0 4px 12px rgba(239, 68, 68, 0.35);
}
.btn.s {
  padding: 6px 12px;
  font-size: .82rem;
  border-radius: 10px;
}
:focus-visible { outline: 3px solid var(--emerald); outline-offset: 2px; }

/* Secondary Cards: White on #F3F7FB background, soft shadow, rounded-2xl */
.card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-2xl);
  padding: 20px;
  box-shadow: var(--shadow);
}

/* Key Feature Cards: Solid Navy (#0F2A47) with White Text */
.stats {
  display: grid;
  gap: 14px;
  grid-template-columns: repeat(2, 1fr);
  margin: 20px 0;
}
@media (min-width: 760px) {
  .stats { grid-template-columns: repeat(4, 1fr); }
  .two { display: grid; grid-template-columns: 1.4fr 1fr; gap: 14px; }
}

.stat {
  background: var(--navy);
  color: #FFFFFF;
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: var(--radius-2xl);
  padding: 18px 20px;
  box-shadow: var(--shadow);
}
.stat-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}
.stat small {
  color: var(--text-on-navy-muted);
  font-weight: 600;
  font-size: .85rem;
}
/* Large numbers/stats: extra-bold, white on navy, large size */
.stat div {
  font-size: 1.95rem;
  font-weight: 800;
  color: #FFFFFF;
  letter-spacing: -.02em;
}
.stat-icon {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  background: var(--emerald);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: #FFFFFF;
  box-shadow: 0 2px 6px rgba(16, 185, 129, 0.3);
}

main { padding: 24px 0 48px; }
.bar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; align-items: center; }
input, select, textarea {
  padding: 10px 14px;
  border: 1.5px solid var(--border);
  border-radius: 12px;
  font: inherit;
  background: #FFFFFF;
  color: var(--text-heading);
  transition: border-color .15s ease, box-shadow .15s ease;
}
input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: var(--emerald);
  box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
}

.sc { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; min-width: 620px; }
th, td {
  padding: 12px 10px;
  border-bottom: 1px solid var(--border);
  text-align: left;
  font-size: .9rem;
  white-space: nowrap;
}
th {
  color: var(--text-muted);
  font-weight: 700;
  font-size: .82rem;
  text-transform: uppercase;
  letter-spacing: .03em;
}
tr:last-child td { border-bottom: 0; }

.badge {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 99px;
  font-size: .78rem;
  font-weight: 700;
  background: rgba(15, 42, 71, 0.08);
  color: var(--navy);
}
.badge.ok { background: rgba(16, 185, 129, 0.14); color: #065F46; }
.badge.bad { background: var(--bad); color: var(--err); }

.login {
  max-width: 400px;
  margin: 60px auto;
  padding: 32px 28px;
}
label {
  display: block;
  font-weight: 700;
  font-size: .88rem;
  margin: 12px 0 5px;
  color: var(--text-heading);
}
.login input { width: 100%; }
.err { color: var(--err); font-weight: 600; min-height: 1.3em; margin: 8px 0 0; font-size: .88rem; }

dialog {
  border: 1px solid var(--border);
  border-radius: var(--radius-2xl);
  background: var(--card-bg);
  color: var(--text-heading);
  width: min(440px, 92vw);
  padding: 24px;
  box-shadow: var(--shadow-lg);
}
dialog::backdrop {
  background: rgba(11, 32, 56, 0.45);
  backdrop-filter: blur(4px);
}
dialog textarea { width: 100%; min-height: 84px; }

.toast {
  position: fixed;
  left: 50%;
  bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  background: var(--navy-dark);
  color: #FFFFFF;
  border: 1px solid rgba(255, 255, 255, 0.12);
  padding: 10px 22px;
  border-radius: 99px;
  font-weight: 600;
  font-size: .92rem;
  z-index: 50;
  box-shadow: var(--shadow-lg);
}

.log { padding: 0; margin: 0; }
.log li {
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
  list-style: none;
  font-size: .9rem;
}
.log li:last-child { border-bottom: 0; }
.log small { color: var(--text-muted); }
.mut { color: var(--text-muted); }
</style>
</head>
<body>
<div id="root"></div>
<script src="../shared/demo-store.js"></script>
<script>
"use strict";
const ADMIN="admin@bestloans.co.ke";
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const KES=n=>"KES "+Math.round(n).toLocaleString("en-KE");
const D=t=>new Date(t).toLocaleDateString("en-KE",{day:"numeric",month:"short"});
let seed=42;const rnd=()=>(seed=seed*16807%2147483647)/2147483647;
const pick=a=>a[Math.floor(rnd()*a.length)];
const NAMES=["Wanjiru Kamau","Otieno Odhiambo","Achieng Akinyi","Mwangi Njoroge","Fatuma Hassan","Kipchoge Rotich","Naliaka Wekesa","Mutua Musyoka","Zawadi Mwakio","Kiprop Cheruiyot","Amina Abdi","Njeri Gathoni","Ouma Ochieng","Chebet Langat","Kamau Waweru","Halima Juma","Barasa Simiyu","Wambui Ngugi","Ali Mohamed","Atieno Onyango","Kariuki Mbugua","Nasimiyu Wafula","Kilonzo Mwende","Jepkoech Sang"];
const COUNTIES=["Nairobi","Mombasa","Kisumu","Nakuru","Uasin Gishu","Kiambu","Machakos","Kakamega"];
const S={in:false,tab:"Overview",uq:"",us:"All",as:"All",users:[],apps:[],log:[]};
const DAY=864e5,NOW=Date.now();
NAMES.forEach((n,i)=>{const created=NOW-Math.floor(rnd()*14)*DAY-Math.floor(rnd()*DAY);
  S.users.push({id:i+1,name:n,phone:"07"+String(Math.floor(10000000+rnd()*89999999)),county:pick(COUNTIES),created,status:i===5||i===17?"SUSPENDED":"ACTIVE"});});
S.users.forEach(u=>{
  if(rnd()>.45)S.apps.push({id:S.apps.length+1,uid:u.id,amt:Math.round((1000+rnd()*24000)/500)*500,days:pick([14,30,30,45,60]),purpose:pick(["Business","School fees","Emergency","Rent"]),st:"PENDING",t:u.created+2*DAY,note:""});});
function mergeRecords(existing,incoming){return incoming.reduce((records,item)=>{
  const exists=records.some(record=>String(record.id)===String(item.id));
  return exists?records.map(record=>String(record.id)===String(item.id)?item:record):[...records,item];
},existing)}
function syncSharedData(){
  if(!window.BestLoansStore)return;
  const data=window.BestLoansStore.getSnapshot();
  S.users=mergeRecords(S.users,data.users);S.apps=mergeRecords(S.apps,data.applications);

}
syncSharedData();
const U=id=>S.users.find(u=>String(u.id)===String(id));
const mask=p=>p.slice(0,4)+"***"+p.slice(-3);
const now=()=>new Date().toLocaleString("en-KE",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
const audit=(action,entity)=>S.log.unshift({t:now(),actor:ADMIN,action,entity});
function toast(m){const e=document.createElement("div");e.className="toast";e.setAttribute("role","status");e.textContent=m;document.body.appendChild(e);setTimeout(()=>e.remove(),2200)}
const bd=s=>`<span class="badge ${["SUCCESS","APPROVED","ACTIVE"].includes(s)?"ok":["FAILED","CANCELLED","REJECTED","SUSPENDED"].includes(s)?"bad":""}">${s}</span>`;

function login(){$("#root").innerHTML=`<div class="login card"><div style="display:flex;align-items:center;gap:10px;margin-bottom:14px"><span class="logo-badge"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L3 7v6c0 5.5 3.8 10.7 9 12 5.2-1.3 9-6.5 9-12V7l-9-5z"></path><path d="M9 12l2 2 4-4"></path></svg></span><b style="font-size:1.25rem;color:var(--navy)">Best Loans Kenya</b></div>
<h1 style="font-size:1.35rem;margin-bottom:6px">Admin sign in</h1><p class="mut" style="margin-top:0">Demo: any email and a password of 6+ characters.</p>
<form id="lf" novalidate><label for="em">Email</label><input id="em" type="email" value="${ADMIN}" autocomplete="username"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password">
<div class="err" id="e" role="alert"></div><button class="btn" style="width:100%;margin-top:14px">Sign in</button></form><p class="mut" style="margin:16px 0 0;text-align:center"><a href="../frontend/index.html">Back to public site</a></p></div>`;
  $("#lf").onsubmit=e=>{e.preventDefault();if(!/\S+@\S+/.test($("#em").value)||$("#pw").value.length<6)return $("#e").textContent="Enter a valid email and a password with 6+ characters.";
    S.in=true;audit("ADMIN_LOGIN","admin");render()}}

function overview(){
  const pend=S.apps.filter(a=>a.st==="PENDING").length;
  const days=[...Array(14)].map((_,i)=>{const s=NOW-(13-i)*DAY;return{d:s,n:S.users.filter(u=>u.created>s-DAY/2&&u.created<=s+DAY/2).length}});
  const mx=Math.max(1,...days.map(x=>x.n));
  const bars=days.map((x,i)=>{const h=x.n/mx*110;return`<g><title>${D(x.d)}: ${x.n} sign-ups</title><rect x="${i*30+6}" y="${130-h}" width="20" height="${h}" rx="4" fill="var(--emerald)"/><text x="${i*30+16}" y="146" text-anchor="middle" font-size="9" fill="var(--text-muted)">${new Date(x.d).getDate()}</text></g>`}).join("");
  return`<div class="stats">
<div class="card stat"><div class="stat-top"><small>Total users</small><span class="stat-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg></span></div><div>${S.users.length}</div></div>
<div class="card stat"><div class="stat-top"><small>All applications</small><span class="stat-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg></span></div><div>${S.apps.length}</div></div>
<div class="card stat"><div class="stat-top"><small>Applications to review</small><span class="stat-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg></span></div><div>${pend}</div></div></div>
<div class="two"><div class="card"><h2>Sign-ups, last 14 days</h2><svg viewBox="0 0 426 152" width="100%" role="img" aria-label="Bar chart of daily sign-ups over the last 14 days">${bars}</svg></div>
</div>`}

function users(){
  const q=S.uq.toLowerCase(),L=S.users.filter(u=>(S.us==="All"||u.status===S.us)&&(u.name.toLowerCase().includes(q)||u.phone.includes(q)));
  return`<div class="bar"><input id="uq" placeholder="Search name or phone" value="${esc(S.uq)}" aria-label="Search users" style="min-width:240px"><select id="us" aria-label="Filter by status">${["All","ACTIVE","SUSPENDED"].map(x=>`<option${x===S.us?" selected":""}>${x}</option>`).join("")}</select></div>
<div class="card sc"><table><tr><th>Name</th><th>Phone</th><th>County</th><th>Joined</th><th>Status</th><th></th></tr>
${L.length?L.map(u=>`<tr><td><b>${esc(u.name)}</b></td><td>${mask(u.phone)}</td><td>${u.county}</td><td>${D(u.created)}</td><td>${bd(u.status)}</td>
<td><button class="btn o s" data-u="${esc(u.id)}">${u.status==="ACTIVE"?"Suspend":"Reactivate"}</button></td></tr>`).join(""):`<tr><td colspan="6" class="mut">No users match this search. Clear the search or change the status filter.</td></tr>`}</table></div>`}

function apps(){
  const L=S.apps.filter(a=>S.as==="All"||a.st===S.as);
  return`<div class="bar"><select id="as" aria-label="Filter by status">${["All","PENDING","APPROVED","REJECTED"].map(x=>`<option${x===S.as?" selected":""}>${x}</option>`).join("")}</select></div>
<div class="card sc"><table><tr><th>Applicant</th><th>Amount</th><th>Period</th><th>Purpose</th><th>Status</th><th>Decision</th></tr>
${L.length?L.map(a=>`<tr><td><b>${esc(U(a.uid).name)}</b></td><td><b>${KES(a.amt)}</b></td><td>${a.days} days</td><td>${a.purpose}</td><td>${bd(a.st)}</td>
<td>${a.st==="PENDING"?`<button class="btn s" data-a="${esc(a.id)}" data-d="APPROVED">Approve</button> <button class="btn r s" data-a="${esc(a.id)}" data-d="REJECTED">Reject</button>`:`<span class="mut">${esc(a.note||"No note")}</span>`}</td></tr>`).join(""):`<tr><td colspan="6" class="mut">No applications with this status.</td></tr>`}</table></div>`}

function auditv(){return`<div class="card"><h2>Audit log</h2><ul class="log">${S.log.map(l=>`<li><b>${l.action}</b> on ${esc(l.entity)}<br><small>${esc(l.actor)} · ${l.t}</small></li>`).join("")}</ul></div>`}

const TABS={Overview:overview,Users:users,Applications:apps,"Audit log":auditv};
function render(){
  if(!S.in)return login();
  $("#root").innerHTML=`<header><div class="w top"><div class="brand"><span class="logo-badge"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L3 7v6c0 5.5 3.8 10.7 9 12 5.2-1.3 9-6.5 9-12V7l-9-5z"></path><path d="M9 12l2 2 4-4"></path></svg></span><b>Best Loans Kenya Admin</b></div><span>${ADMIN} · SUPER_ADMIN</span><a class="btn o s nav-btn" href="../frontend/index.html">Public site</a><button class="btn o s nav-btn" id="out">Sign out</button></div></header>
<div class="tabs" role="tablist"><div class="w">${Object.keys(TABS).map(t=>`<button role="tab" aria-selected="${t===S.tab}" data-t="${t}">${t}</button>`).join("")}</div></div>
<main class="w"><h1>${S.tab}</h1>${TABS[S.tab]()}</main>
<dialog id="dg"><form method="dialog" id="df"><h2 id="dt"></h2><label for="dn" style="font-weight:700;font-size:.88rem">Note (saved with the decision)</label><textarea id="dn"></textarea>
<div class="bar" style="margin:16px 0 0;justify-content:flex-end"><button class="btn o" value="x" formnovalidate>Cancel</button><button class="btn" id="dok" value="ok">Confirm</button></div></form></dialog>`;
  $("#out").onclick=()=>{S.in=false;render()};
  document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{S.tab=b.dataset.t;render()});
  const on=(id,f)=>{const e=$(id);e&&(e.onchange=f)};
  const uq=$("#uq");if(uq)uq.oninput=()=>{S.uq=uq.value;const p=uq.selectionStart;render();const n=$("#uq");n.focus();n.setSelectionRange(p,p)};
  on("#us",e=>{S.us=e.target.value;render()});on("#as",e=>{S.as=e.target.value;render()});
  document.querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>{const u=U(b.dataset.u),updated={...u,status:u.status==="ACTIVE"?"SUSPENDED":"ACTIVE"};
    S.users=S.users.map(user=>String(user.id)===String(updated.id)?updated:user);
    if(window.BestLoansStore.getUsers().some(user=>String(user.id)===String(updated.id)))window.BestLoansStore.saveUser(updated);
    audit("USER_"+updated.status,updated.name);toast(updated.name+" is now "+updated.status.toLowerCase());render()});
  document.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{const a=S.apps.find(x=>String(x.id)===String(b.dataset.a)),d=b.dataset.d;
    $("#dt").textContent=(d==="APPROVED"?"Approve ":"Reject ")+KES(a.amt)+" for "+U(a.uid).name;$("#dn").value="";$("#dg").showModal();
    $("#df").onsubmit=e=>{if(e.submitter&&e.submitter.value!=="ok")return;const updated={...a,st:d,note:$("#dn").value.trim()};
      S.apps=S.apps.map(application=>String(application.id)===String(updated.id)?updated:application);
      if(window.BestLoansStore.getApplications().some(application=>String(application.id)===String(updated.id)))window.BestLoansStore.saveApplication(updated);
      audit("APPLICATION_"+d,"#"+updated.id);toast("Application "+d.toLowerCase());setTimeout(render,0)}});
}
if(window.BestLoansStore)window.BestLoansStore.subscribe(()=>{syncSharedData();if(S.in)render()});
render();
</script>
</body>
</html>
